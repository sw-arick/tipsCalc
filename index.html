<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator | Fatin Jalal Arick</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="div">
        <h2 id="heading">Tips Calculator</h2>
        <p id="para">
          Enter the bill amount and tip percentage to calculate the total.
        </p>

        <label>Bill amount:</label> <br />
        <input type="number" id="bill" /> <br />
        <label>Tip percentage:</label> <br />
        <input type="number" id="tip" /> <br />
        <button type="submit" id="submitBtn">CALCULATE</button>

        <p>Total: <p id="total"></p></p>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
